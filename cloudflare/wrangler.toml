name = "evtl-leis"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Vigia: toda segunda às 09:00 UTC (06:00 em Brasília)
[triggers]
crons = ["0 9 * * 1"]

[[d1_databases]]
binding = "DB"
database_name = "evtl-leis"
database_id = "318dc4b6-dafe-4008-bd4f-d9e4e3e8862b"   # saída de: npx wrangler d1 create evtl-leis

[observability]
enabled = true
