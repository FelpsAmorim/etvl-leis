name: atualizar-leis
on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch: {}
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Diagnostico de rede
        run: python -m evtl_leis diagnostico || true
      - name: Extrair e consolidar
        run: python -m evtl_leis atualizar --todas || true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: python -m evtl_leis exportar
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Carregar no D1
        working-directory: cloudflare
        run: npm ci && npx wrangler d1 execute evtl-leis --remote --file=d1_dados.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
